<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Form definitions</title>
  </head>
  <body>
    <!--
      Netlify detects forms by parsing static HTML at deploy time. Next.js
      doesn't emit a plain HTML file for the contact page, so this file is the
      form's declaration and the endpoint the React form POSTs to.

      Every field the real form sends must be listed here, with matching
      name attributes, or Netlify silently drops it from the submission.
      See components/Contact.jsx.
    -->
    <form name="contact" data-netlify="true" data-netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="contact" />
      <input type="text" name="bot-field" />
      <input type="text" name="name" />
      <input type="email" name="email" />
      <input type="text" name="company" />
      <input type="text" name="scope" />
      <input type="text" name="budget" />
      <textarea name="message"></textarea>
    </form>
    <!--
      Client project brief (app/[locale]/brief). The form posts a handful of
      filterable fields plus one formatted `summary` blob, so the notification
      email reads as a brief rather than sixty rows. Adding a question in
      lib/brief.js needs no change here unless you also want it as its own
      column — it already travels inside `summary`.
    -->
    <form name="brief" data-netlify="true" data-netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="brief" />
      <input type="text" name="bot-field" />
      <input type="text" name="language" />
      <input type="text" name="contact_name" />
      <input type="text" name="business_name" />
      <input type="email" name="email" />
      <input type="text" name="phone" />
      <input type="text" name="sector" />
      <input type="text" name="budget" />
      <input type="text" name="main_goal" />
      <input type="text" name="deadline" />
      <input type="text" name="content_deadline" />
      <textarea name="summary"></textarea>
    </form>
  </body>
</html>
